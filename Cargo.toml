[package]
name = "agent-armor"
version = "0.1.0"
edition = "2021"
description = "Security scanner for AI agents"
license = "MIT"

[[bin]]
name = "agent-armor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
json5 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
